<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Form Website</title>
  <link rel="stylesheet" href="web.css" /> <!-- Link to your web.css -->
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 800px;
      width: 100%;
      height: 90vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    iframe {
      flex-grow: 1;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 100%;
      min-height: 0;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        height: 100vh;
        padding: 10px;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fill Out the Form</h1>
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSc03_k85oLWIoH6uwf-L1MykLyzmEXyPdT0XneIGn14CBWM6Q/viewform?embedded=true"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      loading="lazy"
    >
      Loading…
    </iframe>
  </div>
</body>
</html>
